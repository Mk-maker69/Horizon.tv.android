name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Abrir o zip do projeto
        run: unzip -q HorizonTV-android.zip -d proj
      - name: Compilar
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - name: Renomear
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk Horizon.apk
      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: HorizonTV-apk
          path: Horizon.apk
      - name: Publicar link fixo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Horizon TV
          files: Horizon.apk
          make_latest: true
